<section id="create-blog" style="display:none; padding: 20px; background: #fff; border-radius: 10px; max-width: 700px; margin: 20px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
  <h2>Create New Post</h2>
  <input type="text" id="new-title" placeholder="Blog Title" style="width: 100%; padding: 10px; margin-bottom: 10px;">
  <textarea id="new-content" placeholder="Content (HTML allowed)" style="width: 100%; height: 150px; padding: 10px;"></textarea>
  <button onclick="saveBlog()" style="background: #4caf50; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 5px;">Post Blog</button>
</section>
