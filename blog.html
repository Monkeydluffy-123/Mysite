<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blog</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>
    <header>
        <h1>Tech Blog</h1>
        <img src="1img.jpg" alt="Profile" class="pfp">
    </header>

    <section id="create-blog" style="display:none; padding: 20px; background: #eee; margin: 20px auto; max-width: 700px; border-radius: 8px;">
        <h3>Create New Post</h3>
        <input type="text" id="new-title" placeholder="Blog Title" style="width: 100%; padding: 10px; margin-bottom: 10px;"><br>
        <textarea id="new-content" placeholder="Write here... (HTML allowed)" style="width: 100%; height: 100px; padding: 10px;"></textarea><br>
        <button onclick="saveBlog()" style="padding: 10px 20px; background: #35424a; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Post Blog</button>
    </section>

    <main id="blog-container"></main>

    <script type="module" src="blog.js"></script>
</body>
</html>
